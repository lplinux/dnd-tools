<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎲 D&D Tools</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Fonts for the NPC sheet's original parchment design -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!--
      The CSS variable tokens (--bg, --gold, etc.) live in
      src/styles/globals.css, imported from main.jsx. The old public/theme.css
      and public/app.css that used to hold them have been deleted.
    -->
    <script>
      // Apply saved theme immediately, before React mounts, to prevent flash
      (function () {
        const t = localStorage.getItem('hc-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
